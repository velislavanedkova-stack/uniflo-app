<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniFlo | Student Life</title>

<style>
:root{
--primary:#6c5ce7;
--primary2:#8b7cf6;
--bg:#f6f7fb;
--card:#fff;
--text:#202236;
--muted:#74788d;
--line:#e9eaf2;
--green:#35b779;
--orange:#ff9f43;
--red:#ff6b6b;
--shadow:0 10px 35px rgba(43,38,91,.08);
--radius:20px
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Segoe UI,sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select,textarea{font:inherit}

button{
cursor:pointer;
border:0
}

.hidden{display:none!important}

.auth{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(135deg,#eeeaff,#f8f9ff)
}

.auth-card{
width:min(440px,100%);
background:white;
border-radius:28px;
padding:35px;
box-shadow:0 25px 70px rgba(55,45,130,.14)
}

.logo{
font-size:30px;
font-weight:900;
color:var(--primary)
}

.logo span{color:#222}

.auth-card h1{
margin:22px 0 8px;
font-size:28px
}

.auth-card p{
color:var(--muted);
margin-bottom:24px
}

.field{
margin:13px 0
}

.field label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:7px
}

.field input,
.field select,
.field textarea{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
outline:none
}

.field input:focus{
border-color:var(--primary)
}

.primary{
background:var(--primary);
color:white;
padding:13px;
border-radius:12px;
font-weight:bold;
width:100%;
margin-top:8px
}

.secondary{
background:#efedff;
color:var(--primary);
padding:11px 15px;
border-radius:11px;
font-weight:bold
}

.auth-switch{
text-align:center;
margin-top:18px;
color:var(--muted)
}

.auth-switch button{
background:none;
color:var(--primary);
font-weight:bold
}

.layout{
display:flex;
min-height:100vh
}

.sidebar{
width:250px;
background:white;
border-right:1px solid var(--line);
padding:24px 15px;
position:fixed;
top:0;
bottom:0;
z-index:10
}

.sidebar .logo{
padding:0 12px 28px
}

.nav button{
display:flex;
align-items:center;
gap:12px;
width:100%;
padding:13px 14px;
margin:4px 0;
background:transparent;
color:#686b7e;
border-radius:12px;
text-align:left;
font-weight:bold
}

.nav button.active,
.nav button:hover{
background:#efedff;
color:var(--primary)
}

.nav-icon{
width:22px;
text-align:center
}

.logout{
position:absolute;
bottom:24px;
left:15px;
right:15px
}

.main{
margin-left:250px;
width:calc(100% - 250px);
padding:24px;
max-width:1500px
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px
}

.topbar h2{
margin:0;
font-size:27px
}

.profile{
display:flex;
align-items:center;
gap:10px;
background:white;
padding:8px 12px;
border-radius:14px;
box-shadow:var(--shadow)
}

.avatar{
width:36px;
height:36px;
border-radius:50%;
display:grid;
place-items:center;
background:#e8e5ff;
color:var(--primary);
font-weight:900
}

.page{display:none}
.page.active{display:block}

.hero{
background:linear-gradient(135deg,#6c5ce7,#9185f5);
color:white;
border-radius:24px;
padding:27px;
box-shadow:var(--shadow);
margin-bottom:20px
}

.hero h1{
margin:0 0 7px;
font-size:30px
}

.hero p{
margin:0;
opacity:.9
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:16px
}

.grid2{
display:grid;
grid-template-columns:1.4fr 1fr;
gap:16px;
margin-top:16px
}

.card{
background:white;
border:1px solid var(--line);
border-radius:var(--radius);
padding:20px;
box-shadow:var(--shadow)
}

.card h3{
margin:0 0 14px
}

.stat b{
font-size:27px
}

.stat small{
display:block;
color:var(--muted);
margin-top:5px
}

.section-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px
}

.section-head h2,
.section-head h3{
margin:0
}

.list{
display:flex;
flex-direction:column;
gap:10px
}

.row{
display:flex;
align-items:center;
justify-content:space-between;
padding:13px;
border:1px solid var(--line);
border-radius:13px;
background:white
}

.row-left{
display:flex;
align-items:center;
gap:12px
}

.badge{
padding:5px 9px;
border-radius:8px;
font-size:12px;
font-weight:bold;
background:#efedff;
color:var(--primary)
}

.badge.green{
background:#e7f8ef;
color:#21935d
}

.badge.orange{
background:#fff1df;
color:#d27a18
}

.badge.red{
background:#ffe9e9;
color:#d95353
}

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:16px
}

.toolbar input,
.toolbar select{
padding:11px 12px;
border:1px solid var(--line);
border-radius:11px;
background:white
}

.table{
width:100%;
border-collapse:collapse
}

.table th,
.table td{
padding:13px;
border-bottom:1px solid var(--line);
text-align:left
}

.table th{
color:var(--muted);
font-size:13px
}

.task{
display:flex;
gap:12px;
align-items:center
}

.task input{
width:18px;
height:18px
}

.schedule{
display:grid;
grid-template-columns:80px repeat(5,1fr);
border:1px solid var(--line);
border-radius:15px;
overflow:hidden;
background:white
}

.schedule>div{
padding:12px;
border-right:1px solid var(--line);
border-bottom:1px solid var(--line);
min-height:70px
}

.schedule .day{
font-weight:bold;
background:#f7f6ff;
text-align:center;
min-height:auto
}

.lesson{
background:#efedff;
border-left:4px solid var(--primary);
border-radius:9px;
padding:8px;
font-size:12px
}

.lesson b{
display:block;
font-size:13px
}

.map-wrap{
height:560px;
border-radius:18px;
overflow:hidden;
border:1px solid var(--line);
background:#eef1f7;
position:relative
}

.fake-map{
height:100%;
position:relative;
background:
linear-gradient(25deg,#dcefe4 0 18%,transparent 18% 100%),
linear-gradient(70deg,#e8e3d6 0 12%,transparent 12% 100%),
#edf0f4;
overflow:hidden
}

.road{
position:absolute;
background:white;
border:2px solid #d6d8df;
border-radius:99px;
transform:rotate(-15deg)
}

.road.r1{
width:120%;
height:58px;
left:-8%;
top:38%
}

.road.r2{
width:110%;
height:45px;
left:-5%;
top:62%;
transform:rotate(18deg)
}

.road.r3{
width:35px;
height:120%;
left:53%;
top:-10%;
transform:rotate(8deg)
}

.water{
position:absolute;
right:-10%;
top:-5%;
width:42%;
height:75%;
background:#bfe4f1;
border-radius:50%
}

.pin{
position:absolute;
width:28px;
height:28px;
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
background:var(--primary);
box-shadow:0 4px 10px #5555
}

.pin i{
display:block;
width:9px;
height:9px;
background:white;
border-radius:50%;
margin:9px
}

.pin.stop{background:#ff8a3d}
.pin.shop{background:#35b779}
.pin.cafe{background:#c47a4b}

.map-label{
position:absolute;
background:white;
padding:7px 9px;
border-radius:8px;
font-size:12px;
font-weight:bold;
box-shadow:0 3px 12px #0002
}

.place-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.place{
padding:17px;
border:1px solid var(--line);
border-radius:15px;
background:white
}

.place .emoji{
font-size:28px
}

.place h4{
margin:8px 0 4px
}

.place p{
margin:0;
color:var(--muted);
font-size:13px
}

.budget{
display:flex;
align-items:center;
gap:18px
}

.circle{
width:120px;
height:120px;
border-radius:50%;
display:grid;
place-items:center;
background:conic-gradient(var(--primary) 0 62%,#ececf4 62%);
position:relative
}

.circle:after{
content:"";
position:absolute;
inset:12px;
background:white;
border-radius:50%
}

.circle span{
position:relative;
z-index:1;
font-weight:900
}

.mobile-nav{
display:none
}

@media(max-width:900px){

.sidebar{
display:none
}

.main{
margin-left:0;
width:100%;
padding:15px;
padding-bottom:80px
}

.grid{
grid-template-columns:repeat(2,1fr)
}

.grid2{
grid-template-columns:1fr
}

.place-grid{
grid-template-columns:1fr 1fr
}

.mobile-nav{
display:flex;
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
border-top:1px solid var(--line);
z-index:20;
justify-content:space-around;
padding:8px
}

.mobile-nav button{
background:none;
color:#777;
font-size:11px
}

.mobile-nav button.active{
color:var(--primary)
}

.schedule{
grid-template-columns:55px repeat(5,130px);
overflow:auto
}

.schedule>div{
min-width:130px
}

.schedule>div:first-child{
min-width:55px
}

.map-wrap{
height:430px
}
}

@media(max-width:550px){

.grid{
grid-template-columns:1fr 1fr
}

.place-grid{
grid-template-columns:1fr
}

.hero h1{
font-size:24px
}

.topbar h2{
font-size:22px
}
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const app=document.getElementById("app");

const KEY="unifloUser";

const state={
page:"home",
user:JSON.parse(localStorage.getItem(KEY)||"null"),
auth:"login"
};

const busLines=[
["14","ЖП гара ↔ Владиславово","ЖП гара","Владиславово","06:00–22:30"],
["17","Почивка ↔ Владиславово","Почивка","Владиславово","05:40–23:00"],
["20","ЖП гара ↔ Аспарухово","ЖП гара","Аспарухово","05:30–23:10"],
["31A","ЖП гара ↔ Златни пясъци","ЖП гара","Златни пясъци","06:00–22:00"],
["409","Летище ↔ Златни пясъци","Летище Варна","Златни пясъци","05:00–23:30"]
];

const stops=[
"Катедралата",
"Община Варна",
"Чаталджа",
"ВИНС",
"Спортна зала",
"Почивка",
"ЖП гара",
"Севастопол",
"Централна поща",
"Златни пясъци"
];

const places=[
["☕","Кафе Морско","Кафене","Близо до ВИНС"],
["🛒","Lidl","Супермаркет","Център / Чаталджа"],
["🛍️","Grand Mall","Търговски център","бул. Андрей Сахаров"],
["☕","Costa Coffee","Кафене","Център"],
["💊","Аптека","Аптека","24/7 опция в центъра"],
["🍕","Пицария","Храна","В близост до общежитията"]
];

function save(){
localStorage.setItem(KEY,JSON.stringify(state.user))
}

function authScreen(){

app.innerHTML=`

<div class="auth">

<div class="auth-card">

<div class="logo">
Uni<span>Flo</span> 🎓
</div>

<h1>
${state.auth==="login"
?"Добре дошла обратно!"
:"Създай своя UniFlo профил"}
</h1>

<p>
${state.auth==="login"
?"Всичко за студентския ти живот на едно място."
:"Регистрация за няколко секунди."}
</p>

${
state.auth==="register"
?
`
<div class="field">
<label>Име</label>
<input id="name" placeholder="Твоето име">
</div>
`
:""
}

<div class="field">
<label>Имейл</label>
<input id="email" type="email" placeholder="name@email.com">
</div>

<div class="field">
<label>Парола</label>
<input id="pass" type="password" placeholder="••••••••">
</div>

<button class="primary" onclick="submitAuth()">
${state.auth==="login"?"Вход":"Регистрация"}
</button>

<div class="auth-switch">

${
state.auth==="login"
?"Нямаш профил?"
:"Вече имаш профил?"
}

<button onclick="
state.auth=state.auth==='login'?'register':'login';
authScreen()
">

${
state.auth==="login"
?"Регистрирай се"
:"Влез"
}

</button>

</div>

</div>

</div>
`;
}

function submitAuth(){

const email=document.getElementById("email").value.trim();
const pass=document.getElementById("pass").value.trim();

if(!email||!pass){
alert("Попълни имейла и паролата.");
return
}

state.user={
name:
state.auth==="register"
?(document.getElementById("name").value.trim()||"Студент")
:"Велислава",
email
};

save();
render();
}

const titles={
home:"Начало",
schedule:"Моят график",
tasks:"Моите задачи",
exams:"Изпити и оценки",
transport:"Автобуси и спирки",
map:"Карта на Варна",
places:"Места около мен",
budget:"Моят бюджет",
notes:"Бележки"
};

function nav(){

const items=[
["home","⌂","Начало"],
["schedule","📅","График"],
["tasks","✓","Задачи"],
["exams","📝","Изпити"],
["transport","🚌","Автобуси"],
["map","🗺️","Карта"],
["places","☕","Места"],
["budget","💰","Бюджет"],
["notes","🗒️","Бележки"]
];

return items.map(x=>`

<button
class="${state.page===x[0]?"active":""}"
onclick="go('${x[0]}')">

<span class="nav-icon">${x[1]}</span>

${x[2]}

</button>

`).join("");
}

function render(){

if(!state.user){
authScreen();
return
}

app.innerHTML=`

<div class="layout">

<aside class="sidebar">

<div class="logo">
Uni<span>Flo</span> 🎓
</div>

<nav class="nav">
${nav()}
</nav>

<button class="nav logout" onclick="logout()">
↪ Изход
</button>

</aside>

<main class="main">

<div class="topbar">

<h2>
${titles[state.page]}
</h2>

<div class="profile">

<div class="avatar">
${(state.user.name||"В")[0].toUpperCase()}
</div>

<b>${state.user.name}</b>

</div>

</div>

${pages[state.page]()}

</main>

<div class="mobile-nav">

${[
["home","⌂"],
["schedule","📅"],
["tasks","✓"],
["transport","🚌"],
["map","🗺️"],
["places","☕"]
].map(x=>`

<button
class="${state.page===x[0]?"active":""}"
onclick="go('${x[0]}')">

${x[1]}<br>

${titles[x[0]].split(" ")[0]}

</button>

`).join("")}

</div>

</div>
`;
}

const pages={

home:()=>`

<div class="hero">

<h1>
Здравей, ${state.user.name}! 👋
</h1>

<p>
UniFlo събира университета, града и ежедневието ти на едно място.
</p>

</div>

<div class="grid">

<div class="card stat">
<b>4</b>
<small>Задачи за тази седмица</small>
</div>

<div class="card stat">
<b>2</b>
<small>Предстоящи изпити</small>
</div>

<div class="card stat">
<b>312 лв.</b>
<small>Оставащ бюджет</small>
</div>

<div class="card stat">
<b>3</b>
<small>Занятия днес</small>
</div>

</div>

<div class="grid2">

<div class="card">

<div class="section-head">

<h3>📅 Днес</h3>

<button
class="secondary"
onclick="go('schedule')">
График
</button>

</div>

<div class="list">

<div class="row">
<div class="row-left">
<span class="badge">10:00</span>
<div>
<b>Икономика</b>
<small>Зала 302</small>
</div>
</div>
</div>

<div class="row">
<div class="row-left">
<span class="badge">12:00</span>
<div>
<b>Туризъм</b>
<small>Аула</small>
</div>
</div>
</div>

<div class="row">
<div class="row-left">
<span class="badge">15:00</span>
<div>
<b>Чужд език</b>
<small>Кабинет 18</small>
</div>
</div>
</div>

</div>

</div>

<div class="card">

<h3>⚡ Бърз достъп</h3>

<div class="list">

<button class="secondary"
onclick="go('transport')">
🚌 Намери автобус
</button>

<button class="secondary"
onclick="go('map')">
🗺️ Отвори карта
</button>

<button class="secondary"
onclick="go('places')">
☕ Кафенета и магазини
</button>

</div>

</div>

</div>
`,

schedule:()=>`

<div class="card">

<div class="section-head">

<h3>Седмица</h3>

<button
class="secondary"
onclick="alert('Добавянето на занятия ще бъде включено тук.')">
＋ Добави
</button>

</div>

<div class="schedule">

<div></div>

${["Пон","Вт","Ср","Чет","Пет"]
.map(d=>`<div class="day">${d}</div>`).join("")}

<div>09:00</div>

<div>
<div class="lesson">
<b>Икономика</b>
Зала 302
</div>
</div>

<div></div>
<div></div>

<div>
<div class="lesson">
<b>Туризъм</b>
Аула
</div>
</div>

<div></div>

<div>11:00</div>

<div></div>

<div>
<div class="lesson">
<b>Чужд език</b>
Каб. 18
</div>
</div>

<div></div>
<div></div>

<div>
<div class="lesson">
<b>Маркетинг</b>
Зала 205
</div>
</div>

<div>13:00</div>

<div></div>
<div></div>

<div>
<div class="lesson">
<b>Статистика</b>
Зала 101
</div>
</div>

<div></div>
<div></div>

</div>

</div>
`,

tasks:()=>`

<div class="card">

<div class="section-head">

<h3>Задачи</h3>

<button
class="secondary"
onclick="addTask()">
＋ Добави задача
</button>

</div>

<div id="tasksList" class="list">

${[
"Курсова работа по туризъм",
"Презентация по маркетинг",
"Подготовка за тест",
"Преговор по икономика"
].map((t,i)=>`

<div class="row">

<div class="task">

<input
type="checkbox"
onchange="
this.parentElement.parentElement.classList.toggle('done')
">

<span>${t}</span>

</div>

<span class="badge ${
i===2
?"red"
:i===1
?"orange"
:""
}">
${i<2?"Тази седмица":"Следваща седмица"}
</span>

</div>

`).join("")}

</div>

</div>
`,

exams:()=>`

<div class="card">

<div class="section-head">

<h3>Предстоящи изпити</h3>

<button class="secondary">
＋ Добави
</button>

</div>

<table class="table">

<tr>
<th>Предмет</th>
<th>Дата</th>
<th>Час</th>
<th>Зала</th>
</tr>

<tr>
<td><b>Икономика</b></td>
<td>18 юни</td>
<td>10:00</td>
<td>302</td>
</tr>

<tr>
<td><b>Туризъм</b></td>
<td>24 юни</td>
<td>13:00</td>
<td>Аула</td>
</tr>

<tr>
<td><b>Маркетинг</b></td>
<td>30 юни</td>
<td>09:00</td>
<td>205</td>
</tr>

</table>

</div>
`,

transport:()=>`

<div class="card">

<div class="section-head">

<h3>🚌 Автобуси във Варна</h3>

<button
class="secondary"
onclick="alert('Тук по-късно може да се свърже реална транспортна информация.')">
ℹ Реално време
</button>

</div>

<div class="toolbar">

<input
id="busSearch"
placeholder="Търси линия или спирка..."
oninput="filterBuses()">

</div>

<div id="busList" class="list">

${busLines.map(b=>`

function go(p){
state.page=p;
render()
}

function logout(){
state.user=null;
localStorage.removeItem(KEY);
authScreen()
}

function addTask(){

const t=prompt("Нова задача:");

if(!t)return;

document
.getElementById("tasksList")
.insertAdjacentHTML(
"beforeend",
`
<div class="row">

<div class="task">

<input type="checkbox">

<span>${t}</span>

</div>

<span class="badge">
Нова
</span>

</div>
`
);

}

function saveNote(){

localStorage.setItem(
"unifloNote",
document.getElementById("note").value
);

alert("Бележката е запазена.");
}

function filterBuses(){

const q=
(document.getElementById("busSearch")?.value||"")
.toLowerCase();

document
.querySelectorAll(".bus")
.forEach(el=>{

el.style.display=
(!q||
el.innerText.toLowerCase().includes(q))
?"flex"
:"none";

});

}

function filterPlaces(q){

document
.querySelectorAll("#placesGrid .place")
.forEach(el=>{

el.style.display=
el.innerText
.toLowerCase()
.includes(q.toLowerCase())
?"block"
:"none";

});

}

render();

</script>
